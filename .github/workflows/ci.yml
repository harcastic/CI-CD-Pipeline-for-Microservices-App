name: Build & Deploy Dockerized Blog App

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub
      - name: DockerHub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build & push all images
      - name: Build & Push Auth
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest ./backend/auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

      - name: Build & Push Blog
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/blog-service:latest ./backend/blog-service
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-service:latest

      - name: Build & Push Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/gateway:latest ./backend/gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/gateway:latest

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      # 4. Deploy to VM
      - name: Deploy All Services
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd devops-app || exit
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export ALLOWED_ORIGINS=http://${{ secrets.VM_HOST }},http://localhost:3000
            echo  "Pulling latest images "
            docker pull ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/blog-service:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/gateway:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest

            echo "Clean old containers to avoid 'ContainerConfig' errors"
            docker-compose down --remove-orphans

            echo "Ensure nginx.conf exists"
            if [ ! -f ./nginx/nginx.conf ]; then
              echo "ERROR: nginx.conf missing"
              exit 1
            fi
            
            echo "Starting updated containers..."
            docker-compose up -d --remove-orphans

            echo "Cleaning unused images..."
            docker image prune -af