name: Build & Push Docker Images

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build & Push Auth Service
      - name: Build & Push Auth
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service ./backend/auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service

      # 4. Blog Service
      - name: Build & Push Blog
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/blog-service ./backend/blog-service
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-service

      # 5. API Gateway
      - name: Build & Push Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway ./backend/gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway

      # 6. Frontend
      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend