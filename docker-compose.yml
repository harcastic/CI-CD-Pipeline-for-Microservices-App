version: "3.8"

services:
  auth:
    image: ${DOCKER_USERNAME}/auth-service:latest
    container_name: auth-service
    restart: always 
    pull_policy: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - SERVICE_NAME=auth-service
      - MONGO_URI=${AUTH_MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=30d
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

  blog:
    image: ${DOCKER_USERNAME}/blog-service:latest
    container_name: blog-service
    restart: always 
    pull_policy: always
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - SERVICE_NAME=blog-service
      - MONGO_URI=${BLOG_MONGO_URI}
      - AUTH_SERVICE_URL=http://auth:5001
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

  gateway:
    image: ${DOCKER_USERNAME}/gateway:latest
    container_name: gateway
    restart: always
    pull_policy: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SERVICE_NAME=api-gateway
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth:5001
      - BLOG_SERVICE_URL=http://blog:5002
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    depends_on:
      - auth
      - blog

  frontend:
    image: ${DOCKER_USERNAME}/frontend:latest
    container_name: frontend
    restart: always
    pull_policy: always
    ports:
      - "3000:3000"
    depends_on:
      - gateway

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - gateway