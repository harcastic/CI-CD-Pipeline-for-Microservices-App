version: "3.0"

services:

  auth:
    build: harcastic/auth-service
    container_name: auth-service
    restart: always
    env_file:
      - ./backend/auth-service/.env
    ports:
      - "5001:5001"

  blog:
    build: harcastic/blog-service
    container_name: blog-service
    restart: always 
    env_file:
      - ./backend/blog-service/.env
    ports:
      - "5002:5002"

  gateway:
    build: harcastic/gateway
    container_name: gateway
    restart: always
    env_file:
      - ./backend/gateway/.env
    ports:
      - "5000:5000"
    depends_on:
      - auth
      - blog

  frontend:
    build: harcastic/frontend
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - gateway


  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - gateway